<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero icons sandbox — Promapparat</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 22% 36%, rgba(114, 190, 235, .14), transparent 34%),
        linear-gradient(135deg, #f7fbfd 0%, #edf5f8 44%, #e4eef3 100%);
      color: #123047;
    }

    .sandbox {
      max-width: 1280px;
      margin: 0 auto;
      padding: 56px 32px 80px;
    }

    .sandbox-head {
      margin-bottom: 36px;
    }

    .sandbox-head h1 {
      margin: 0 0 10px;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #102a42;
    }

    .sandbox-head p {
      margin: 0;
      max-width: 720px;
      font-size: 16px;
      line-height: 1.55;
      color: rgba(16, 42, 66, .68);
    }

    .hero-mock {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border-radius: 32px;
      background:
        linear-gradient(110deg, rgba(255,255,255,.96) 0%, rgba(244,249,252,.94) 52%, rgba(226,236,242,.82) 100%);
      box-shadow: 0 30px 90px rgba(18, 48, 78, .14);
      border: 1px solid rgba(118, 160, 190, .22);
    }

    .hero-mock::before {
      content: "";
      position: absolute;
      inset: 0 46% 0 0;
      background:
        repeating-linear-gradient(0deg, rgba(36, 114, 190, .05) 0 1px, transparent 1px 54px),
        repeating-linear-gradient(90deg, rgba(36, 114, 190, .045) 0 1px, transparent 1px 54px);
      opacity: .55;
      pointer-events: none;
    }

    .hero-mock::after {
      content: "";
      position: absolute;
      inset: 0 0 0 60%;
      background:
        radial-gradient(circle at 52% 42%, rgba(70, 100, 120, .15), transparent 38%),
        linear-gradient(135deg, rgba(36, 55, 70, .08), rgba(36, 55, 70, .16));
      opacity: .65;
      pointer-events: none;
    }

    .hero-icons-zone {
      position: absolute;
      left: clamp(42px, 7vw, 86px);
      bottom: 76px;
      display: grid;
      grid-template-columns: repeat(4, 142px);
      gap: 28px;
      align-items: start;
      z-index: 3;
    }

    .hero-icon-item {
      min-height: 158px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .hero-icon-wrap {
      width: 96px;
      height: 96px;
      position: relative;
    }

    .hero-icon {
      position: absolute;
      inset: 0;
      width: 96px;
      height: 96px;
      object-fit: contain;
      display: block;
      transition: opacity .22s ease, transform .22s ease;
      filter: drop-shadow(0 10px 18px rgba(22, 122, 200, .10));
    }

    .hero-icon-hover {
      opacity: 0;
    }

    .hero-icon-item:hover .hero-icon-normal {
      opacity: 0;
    }

    .hero-icon-item:hover .hero-icon-hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .future-text-slot {
      width: 100%;
      height: 56px;
      margin-top: 14px;
      border-radius: 14px;
      border: 1px dashed rgba(61, 124, 170, .22);
      background: rgba(255,255,255,.38);
    }

    .checks {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .check-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(118, 160, 190, .22);
      color: rgba(16, 42, 66, .72);
      font-size: 14px;
      line-height: 1.45;
    }

    .check-card strong {
      display: block;
      margin-bottom: 4px;
      color: #102a42;
    }

    @media (max-width: 820px) {
      .hero-mock {
        min-height: 520px;
      }

      .hero-icons-zone {
        left: 24px;
        right: 24px;
        bottom: 56px;
        grid-template-columns: repeat(4, 128px);
        gap: 18px;
        overflow-x: auto;
      }

      .hero-icon-wrap,
      .hero-icon {
        width: 88px;
        height: 88px;
      }
    }
  </style>
</head>
<body>
  <main class="sandbox">
    <div class="sandbox-head">
      <h1>Песочница hero-иконок</h1>
      <p>Отдельная проверочная страница. Главная страница не изменена. Hover сделан заменой normal/hover-файлов в одной посадке.</p>
    </div>

    <section class="hero-mock" aria-label="Hero icons sandbox">
      <div class="hero-icons-zone">
        <div class="hero-icon-item">
          <div class="hero-icon-wrap">
            <img class="hero-icon hero-icon-normal" src="/assets/hero-icons-clean-v3/param.png" alt="">
            <img class="hero-icon hero-icon-hover" src="/assets/hero-icons-clean-v3/param-hover.png" alt="">
          </div>
          <div class="future-text-slot"></div>
        </div>

        <div class="hero-icon-item">
          <div class="hero-icon-wrap">
            <img class="hero-icon hero-icon-normal" src="/assets/hero-icons-clean-v3/docs.png" alt="">
            <img class="hero-icon hero-icon-hover" src="/assets/hero-icons-clean-v3/docs-hover.png" alt="">
          </div>
          <div class="future-text-slot"></div>
        </div>

        <div class="hero-icon-item">
          <div class="hero-icon-wrap">
            <img class="hero-icon hero-icon-normal" src="/assets/hero-icons-clean-v3/production.png" alt="">
            <img class="hero-icon hero-icon-hover" src="/assets/hero-icons-clean-v3/production-hover.png" alt="">
          </div>
          <div class="future-text-slot"></div>
        </div>

        <div class="hero-icon-item">
          <div class="hero-icon-wrap">
            <img class="hero-icon hero-icon-normal" src="/assets/hero-icons-clean-v3/import.png" alt="">
            <img class="hero-icon hero-icon-hover" src="/assets/hero-icons-clean-v3/import-hover.png" alt="">
          </div>
          <div class="future-text-slot"></div>
        </div>
      </div>
    </section>

    <div class="checks">
      <div class="check-card"><strong>Alpha</strong>PNG RGBA, фон прозрачный.</div>
      <div class="check-card"><strong>Hover</strong>Тело иконки не меняется.</div>
      <div class="check-card"><strong>Hero</strong>Стоит в нижней левой зоне.</div>
      <div class="check-card"><strong>Текст</strong>Под иконками оставлено место.</div>
    </div>
  </main>
</body>
</html>
